<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f1eb" />
    <script>
      const savedTheme = localStorage.getItem("chorotate-theme");
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", theme === "dark" ? "#111310" : "#f3f1eb");
      const introKey = "chorotate-sign-in-intro-v1";
      document.documentElement.dataset.signInIntro =
        !matchMedia("(prefers-reduced-motion: reduce)").matches &&
        !sessionStorage.getItem(introKey)
          ? "play"
          : "settled";
    </script>
    <title>Chore Relay browser fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
