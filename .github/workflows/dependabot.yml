name: Dependabot promotion

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only trusted main code is ever executed with this write token. No PR
      # checkout, dependency installation, artifacts, or production credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Merge green Dependabot updates and request main CI/deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/automation/dependabot.mjs
